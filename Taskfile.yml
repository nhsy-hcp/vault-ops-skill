version: "3"

dotenv: [".env"]

vars:
  SKILL_SCRIPT: skills/vault-ops/scripts/vault_ops.py

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: One-time setup (python deps, pre-commit hooks, .env from template)
    cmds:
      - test -f .env || cp .env.template .env
      - uv sync
      - uv run pre-commit install
      - mkdir -p .tmp .plans

  deps:
    desc: Check required tools, container runtime, loopback IP and .env
    run: once
    cmds:
      - scripts/check_deps.sh

  up:
    desc: Start the primary Vault Enterprise node (compose.yaml, raft, TLS) on ${VAULT_HOST_IP}:${VAULT_HOST_PORT} (default 127.0.0.1:8210)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-primary "${VAULT_HOST_PORT:-8210}"

  up:dr:
    desc: Start the DR secondary node on ${VAULT_HOST_IP}:${VAULT_DR_HOST_PORT} (default 127.0.0.1:8220)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-dr "${VAULT_DR_HOST_PORT:-8220}"

  up:pr:
    desc: Start the performance secondary node on ${VAULT_HOST_IP}:${VAULT_PR_HOST_PORT} (default 127.0.0.1:8240)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-pr "${VAULT_PR_HOST_PORT:-8240}"

  up:all:
    desc: Start primary, DR and performance secondary nodes
    deps: [deps]
    cmds:
      - task: up
      - task: up:dr
      - task: up:pr

  down:
    desc: Stop and remove all Vault containers and the network (named data volumes and .tmp/vault unseal keys are kept)
    cmds:
      - scripts/vault_down.sh

  down:dr:
    desc: Stop and remove the DR container only
    cmds:
      - scripts/vault_down.sh vault-dr

  down:pr:
    desc: Stop and remove the performance secondary container only
    cmds:
      - scripts/vault_down.sh vault-pr

  dr:enable:
    desc: Enable DR replication primary -> secondary and wait for stream-wals (idempotent)
    cmds:
      - scripts/dr_enable.sh

  dr:status:
    desc: Show DR replication status on both nodes
    cmds:
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_HOST_PORT:-8210}/v1/sys/replication/dr/status | jq -c '.data | {node: \"primary\", mode, state, connection: [.secondaries[]?.connection_status]}'"
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_DR_HOST_PORT:-8220}/v1/sys/replication/dr/status | jq -c '.data | {node: \"dr\", mode, state, connection_state}'"

  pr:enable:
    desc: Enable performance replication primary -> vault-pr, wait for stream-wals, restore token root there (idempotent)
    cmds:
      - scripts/pr_enable.sh

  pr:status:
    desc: Show performance replication status on the primary and vault-pr
    cmds:
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_HOST_PORT:-8210}/v1/sys/replication/performance/status | jq -c '.data | {node: \"primary\", mode, state, known_secondaries, connection: [.secondaries[]?.connection_status]}'"
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_PR_HOST_PORT:-8240}/v1/sys/replication/performance/status | jq -c '.data | {node: \"pr\", mode, state, connection_state}'"

  status:
    desc: Show Vault status
    cmds:
      - vault status

  logs:
    desc: "Tail a node's Vault log (NODE=vault-dr task logs for the DR node)"
    cmds:
      - ${CONTAINER_CLI:-docker} compose logs -f --tail 50 {{.NODE | default "vault-primary"}}

  seed:
    desc: Seed namespaces, mounts, KV data and client activity (root token)
    cmds:
      - uv run --script scripts/seed_vault.py

  seed:findings:
    desc: Seed config that trips every live-testable audit rule (root token)
    cmds:
      - scripts/seed_findings.sh

  token:audit:
    desc: Write vault-ops-readonly policy and mint a 1h token to .tmp/audit-token
    cmds:
      - scripts/audit_token.sh

  token:policies:
    desc: Like token:audit, plus the read-only vault-ops-policy-reader and vault-ops-sentinel-reader add-ons (policy bodies for policies and Sentinel checks)
    cmds:
      - POLICY_READER=1 scripts/audit_token.sh

  token:pr:
    desc: Like token:policies, but minted on the performance secondary (tokens are per cluster) into .tmp/audit-token-pr
    cmds:
      - VAULT_ADDR="${VAULT_PR_ADDR:-https://127.0.0.1:8240}" TOKEN_FILE=.tmp/audit-token-pr POLICY_READER=1 scripts/audit_token.sh

  skill:run:
    desc: "Run the skill script with the audit token: task skill:run -- <audit|health|inventory|usage|entities|diff>"
    cmds:
      # No subcommand given: show the script's help instead of an argparse error.
      - VAULT_TOKEN="$(cat .tmp/audit-token)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/audit-token
        msg: "No audit token; run: task token:audit"

  skill:run:pr:
    desc: "Run the skill script against the performance secondary: task skill:run:pr -- <cmd>"
    cmds:
      - VAULT_ADDR="${VAULT_PR_ADDR:-https://127.0.0.1:8240}" VAULT_TOKEN="$(cat .tmp/audit-token-pr)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/audit-token-pr
        msg: "No PR audit token; run: task token:pr"

  lint:
    desc: Run all pre-commit hooks (ruff, shellcheck, gitleaks, yaml/json)
    cmds:
      # --files covers untracked files too (--all-files only sees tracked ones)
      - git ls-files -co --exclude-standard -z | xargs -0 uv run pre-commit run --files

  test:
    desc: Unit tests (no Vault needed), coverage >= 80%
    cmds:
      - uv run pytest -q --cov=vault_ops --cov-report=term-missing --cov-fail-under=80

  test:integration:
    desc: Integration tests against the seeded dev Vault with the audit token
    cmds:
      - VAULT_TOKEN="$(cat .tmp/audit-token)" VAULT_PR_TOKEN="$(cat .tmp/audit-token-pr 2>/dev/null || true)" uv run pytest -q -m integration
    preconditions:
      - sh: test -s .tmp/audit-token
        msg: "No audit token; run: task token:audit"

  test:ce:
    desc: CE smoke tests against a throwaway Community dev server from compose.ce.yaml (local only, not in CI)
    cmds:
      - scripts/test_ce.sh {{.CLI_ARGS}}

  test:all:
    desc: Unit + integration tests with coverage
    cmds:
      - VAULT_TOKEN="$(cat .tmp/audit-token)" VAULT_PR_TOKEN="$(cat .tmp/audit-token-pr 2>/dev/null || true)" uv run pytest -q -m "integration or not integration" --cov=vault_ops --cov-report=term-missing --cov-fail-under=80

  test:e2e:
    desc: "Full e2e from scratch (destructive: wipes .tmp/vault): down, clean, up:all, dr:enable, pr:enable, seed, seed:findings, tokens, test:all, test:ce, lint"
    cmds:
      - scripts/e2e.sh

  test:ci:
    desc: Full CI pipeline (lint + plugin manifests + unit tests with coverage)
    cmds:
      - task: lint
      - task: plugin:validate
      - task: test

  eval:
    desc: "Skill evals (claude plugin eval, offline cases, uses API credits): task eval -- [--runs 1] [--case <glob>]"
    cmds:
      # --scaffold runs our own evals/**/scaffold scripts to stage fixtures; results land in evals/results/
      - claude plugin eval . --tag offline --scaffold --trust-plugin --no-publish -j 4 {{.CLI_ARGS}}

  docs:diagram:
    desc: Render docs/architecture.svg from docs/architecture.dot (needs Graphviz)
    cmds:
      - dot -Tsvg docs/architecture.dot -o docs/architecture.svg

  plugin:validate:
    desc: Validate the plugin and marketplace manifests (strict)
    cmds:
      - claude plugin validate --strict .
      - claude plugin validate --strict .claude-plugin/plugin.json

  clean:
    desc: Remove node containers and volumes, caches, results (.tmp/vault-ops) and temporary files (keeps .tmp/spec.md and todo.md)
    cmds:
      # Volumes and .tmp/vault/<node>/init.json go together: data without its unseal key can't be unsealed.
      # Tolerant: with the engine stopped or .env empty, still clean the rest and say what was left.
      - VOLUMES=1 scripts/vault_down.sh || echo "warning - node volumes not removed (container engine down or .env incomplete); run 'task clean' again once it is up" >&2
      - rm -rf .pytest_cache .ruff_cache .coverage htmlcov
      - find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - rm -rf .tmp/vault .tmp/vault-ops .tmp/audit-token .tmp/audit-token-pr .tmp/*.log
