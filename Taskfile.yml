version: "3"

dotenv: [".env"]

vars:
  SKILL_SCRIPT: skills/vault-ops/scripts/vault_ops.py

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init:
    desc: One-time setup (python deps, pre-commit hooks, .env from template)
    cmds:
      - test -f .env || cp .env.template .env
      - uv sync
      - uv run pre-commit install
      - mkdir -p .tmp .plans

  deps:
    desc: Check required tools, container runtime, loopback IP and .env
    run: once
    cmds:
      - scripts/check_deps.sh

  up:
    desc: Start the primary Vault Enterprise node (compose.yaml, raft, TLS) on ${VAULT_HOST_IP}:${VAULT_HOST_PORT} (default 127.0.0.1:8210)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-primary "${VAULT_HOST_PORT:-8210}"

  up:dr:
    desc: Start the DR secondary node on ${VAULT_HOST_IP}:${VAULT_DR_HOST_PORT} (default 127.0.0.1:8220)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-dr "${VAULT_DR_HOST_PORT:-8220}"

  up:pr:
    desc: Start the performance secondary node on ${VAULT_HOST_IP}:${VAULT_PR_HOST_PORT} (default 127.0.0.1:8240)
    deps: [deps]
    cmds:
      - scripts/vault_up.sh vault-pr "${VAULT_PR_HOST_PORT:-8240}"

  up:all:
    desc: Start primary, DR and performance secondary nodes
    deps: [deps]
    cmds:
      - task: up
      - task: up:dr
      - task: up:pr

  down:
    desc: Stop and remove all Vault containers and the network (named data volumes and .tmp/vault unseal keys are kept)
    cmds:
      - scripts/vault_down.sh

  down:dr:
    desc: Stop and remove the DR container only
    cmds:
      - scripts/vault_down.sh vault-dr

  down:pr:
    desc: Stop and remove the performance secondary container only
    cmds:
      - scripts/vault_down.sh vault-pr

  dr:enable:
    desc: Enable DR replication primary -> secondary and wait for stream-wals (idempotent)
    cmds:
      - scripts/dr_enable.sh

  dr:status:
    desc: Show DR replication status on both nodes
    cmds:
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_HOST_PORT:-8210}/v1/sys/replication/dr/status | jq -c '.data | {node: \"primary\", mode, state, connection: [.secondaries[]?.connection_status]}'"
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_DR_HOST_PORT:-8220}/v1/sys/replication/dr/status | jq -c '.data | {node: \"dr\", mode, state, connection_state}'"

  pr:enable:
    desc: Enable performance replication primary -> vault-pr, wait for stream-wals, restore token root there (idempotent)
    cmds:
      - scripts/pr_enable.sh

  pr:status:
    desc: Show performance replication status on the primary and vault-pr
    cmds:
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_HOST_PORT:-8210}/v1/sys/replication/performance/status | jq -c '.data | {node: \"primary\", mode, state, known_secondaries, connection: [.secondaries[]?.connection_status]}'"
      - "curl -s --cacert .tmp/vault/tls/vault-ca.pem https://${VAULT_HOST_IP:-127.0.0.1}:${VAULT_PR_HOST_PORT:-8240}/v1/sys/replication/performance/status | jq -c '.data | {node: \"pr\", mode, state, connection_state}'"

  status:
    desc: Show Vault status
    cmds:
      - vault status

  logs:
    desc: "Tail a node's Vault log (NODE=vault-dr task logs for the DR node)"
    cmds:
      - ${CONTAINER_CLI:-docker} compose logs -f --tail 50 {{.NODE | default "vault-primary"}}

  seed:
    desc: Seed namespaces, mounts, KV data and client activity (root token)
    cmds:
      - uv run --script scripts/seed_vault.py

  seed:findings:
    desc: Seed config that trips every live-testable audit rule (root token)
    cmds:
      - scripts/seed_findings.sh

  seed:ns:
    desc: "Seed a child namespace for child-namespace token tests (default admin/; NS=team-x task seed:ns): a chain down to depth 5 and a few mounts (root token)"
    cmds:
      - NS="${NS:-admin}" scripts/seed_child_ns.sh

  token:audit:
    desc: Write vault-ops-readonly policy and mint a 1h token to .tmp/audit-token
    cmds:
      - scripts/audit_token.sh

  token:policies:
    desc: Like token:audit, plus the read-only vault-ops-policy-reader and vault-ops-sentinel-reader add-ons (policy bodies for policies and Sentinel checks)
    cmds:
      - POLICY_READER=1 scripts/audit_token.sh

  token:pr:
    desc: Like token:policies, but minted on the performance secondary (tokens are per cluster) into .tmp/audit-token-pr
    cmds:
      - VAULT_ADDR="${VAULT_PR_ADDR:-https://127.0.0.1:8240}" TOKEN_FILE=.tmp/audit-token-pr POLICY_READER=1 scripts/audit_token.sh

  token:ns:
    desc: "Like token:policies, but written and minted in the child namespace NS (default admin) into .tmp/audit-token-ns"
    cmds:
      - VAULT_NAMESPACE="${NS:-admin}" TOKEN_FILE=.tmp/audit-token-ns POLICY_READER=1 scripts/audit_token.sh
      - echo "${NS:-admin}" > .tmp/audit-token-ns.namespace

  skill:run:
    desc: "Run the skill script with the audit token: task skill:run -- <audit|health|inventory|usage|entities|diff>"
    cmds:
      # No subcommand given: show the script's help instead of an argparse error.
      - VAULT_TOKEN="$(cat .tmp/audit-token)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/audit-token
        msg: "No audit token; run: task token:audit"

  skill:run:pr:
    desc: "Run the skill script against the performance secondary: task skill:run:pr -- <cmd>"
    cmds:
      - VAULT_ADDR="${VAULT_PR_ADDR:-https://127.0.0.1:8240}" VAULT_TOKEN="$(cat .tmp/audit-token-pr)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/audit-token-pr
        msg: "No PR audit token; run: task token:pr"

  skill:run:ns:
    desc: "Run the skill script with the child-namespace token from token:ns: task skill:run:ns -- <cmd>"
    cmds:
      - VAULT_NAMESPACE="$(cat .tmp/audit-token-ns.namespace)" VAULT_TOKEN="$(cat .tmp/audit-token-ns)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}
    preconditions:
      - sh: test -s .tmp/audit-token-ns
        msg: "No child-namespace token; run: task seed:ns token:ns"

  # ---- HCP Vault Dedicated (local only, never in CI): terraform/hcp, user runs hcp:apply / hcp:destroy
  hcp:deps:
    desc: Check terraform, hcp and jq, and HCP credentials (hcp auth login or HCP_CLIENT_ID/HCP_CLIENT_SECRET)
    internal: true
    run: once
    cmds:
      - for tool in terraform hcp jq; do command -v "$tool" >/dev/null || { echo "error - $tool not found" >&2; exit 1; }; done
      - hcp auth print-access-token >/dev/null 2>&1 || { echo "error - no HCP credentials; run - hcp auth login" >&2; exit 1; }

  hcp:init:
    internal: true
    deps: [hcp:deps]
    preconditions:
      - sh: test -n "${HCP_PROJECT_ID:-}"
        msg: "HCP_PROJECT_ID is not set in .env"
    cmds:
      - terraform -chdir=terraform/hcp init -input=false

  hcp:plan:
    desc: Terraform fmt check, validate and plan for the HCP Vault Dedicated cluster (changes nothing)
    deps: [hcp:init]
    cmds:
      - terraform -chdir=terraform/hcp fmt -check
      - terraform -chdir=terraform/hcp validate
      - TF_VAR_project_id="$HCP_PROJECT_ID" terraform -chdir=terraform/hcp plan

  hcp:apply:
    desc: "Create the HCP Vault Dedicated cluster and HVN (terraform apply; run it yourself: Terraform asks to confirm)"
    deps: [hcp:init]
    cmds:
      - TF_VAR_project_id="$HCP_PROJECT_ID" terraform -chdir=terraform/hcp apply
      - terraform -chdir=terraform/hcp output

  hcp:seed:
    desc: Seed the HCP cluster's admin/ namespace with the child-namespace test layout (scripts/seed_child_ns.sh, as the HCP admin token)
    deps: [hcp:deps]
    cmds:
      - scripts/hcp_seed.sh

  hcp:token:
    desc: "Mint an hcp-root token into .tmp/admin-token-hcp (humans/setup only) and a read-only token in admin/ into .tmp/audit-token-hcp: 12h each by default, task hcp:token -- 8h to override"
    deps: [hcp:deps]
    cmds:
      - scripts/hcp_token.sh {{.CLI_ARGS}}

  hcp:token:check:
    internal: true
    silent: true
    cmds:
      - scripts/hcp_token_check.sh

  hcp:env:
    desc: 'Print shell exports for the HCP cluster: eval "$(task hcp:env)" (admin token; TOKEN=audit task hcp:env for the read-only one)'
    silent: true
    # Fails (stderr only) when the token file is missing or the token has expired; stdout stays eval-safe.
    deps: [hcp:token:check]
    cmds:
      # Each statement ends in ";" so both eval "$(task hcp:env)" and an unquoted eval $(task hcp:env) work.
      - echo "export VAULT_ADDR=$(terraform -chdir=terraform/hcp output -raw vault_public_endpoint_url);"
      - echo "export VAULT_NAMESPACE=admin;"
      - echo "export VAULT_TOKEN=\"\$(cat {{.ROOT_DIR}}/.tmp/${TOKEN:-admin}-token-hcp)\";"

  test:hcp:
    desc: Child-namespace integration tests against the HCP cluster with .tmp/audit-token-hcp (local only)
    preconditions:
      - sh: test -s .tmp/audit-token-hcp
        msg: "No HCP token; run: task hcp:token"
    cmds:
      - env -u VAULT_TOKEN -u VAULT_SKIP_VERIFY -u VAULT_CACERT VAULT_ADDR="$(terraform -chdir=terraform/hcp output -raw vault_public_endpoint_url)" VAULT_NAMESPACE=admin VAULT_NS_TOKEN="$(cat .tmp/audit-token-hcp)" VAULT_NS_TOKEN_NAMESPACE=admin uv run pytest -q -rs -m integration tests/test_child_ns.py

  skill:run:hcp:
    desc: "Run the skill script against the HCP cluster with .tmp/audit-token-hcp: task skill:run:hcp -- <cmd>"
    preconditions:
      - sh: test -s .tmp/audit-token-hcp
        msg: "No HCP token; run: task hcp:token"
    cmds:
      - env -u VAULT_SKIP_VERIFY -u VAULT_CACERT VAULT_ADDR="$(terraform -chdir=terraform/hcp output -raw vault_public_endpoint_url)" VAULT_NAMESPACE=admin VAULT_TOKEN="$(cat .tmp/audit-token-hcp)" uv run --script {{.SKILL_SCRIPT}} {{.CLI_ARGS | default "--help"}}

  hcp:destroy:
    desc: "Destroy the HCP Vault Dedicated cluster and HVN (terraform destroy; run it yourself: it prompts)"
    deps: [hcp:init]
    cmds:
      - TF_VAR_project_id="$HCP_PROJECT_ID" terraform -chdir=terraform/hcp destroy

  lint:
    desc: Run all pre-commit hooks (ruff, shellcheck, gitleaks, yaml/json)
    cmds:
      # --files covers untracked files too (--all-files only sees tracked ones)
      - git ls-files -co --exclude-standard -z | xargs -0 uv run pre-commit run --files

  test:
    desc: Unit tests (no Vault needed), coverage >= 80%
    cmds:
      - uv run pytest -q --cov=vault_ops --cov-report=term-missing --cov-fail-under=80

  test:integration:
    desc: Integration tests against the seeded dev Vault with the audit token
    cmds:
      - VAULT_TOKEN="$(cat .tmp/audit-token)" VAULT_PR_TOKEN="$(cat .tmp/audit-token-pr 2>/dev/null || true)" VAULT_NS_TOKEN="$(cat .tmp/audit-token-ns 2>/dev/null || true)" VAULT_NS_TOKEN_NAMESPACE="$(cat .tmp/audit-token-ns.namespace 2>/dev/null || true)" uv run pytest -q -m integration
    preconditions:
      - sh: test -s .tmp/audit-token
        msg: "No audit token; run: task token:audit"

  test:ce:
    desc: CE smoke tests against a throwaway Community dev server from compose.ce.yaml (local only, not in CI)
    cmds:
      - scripts/test_ce.sh {{.CLI_ARGS}}

  test:all:
    desc: Unit + integration tests with coverage
    cmds:
      - VAULT_TOKEN="$(cat .tmp/audit-token)" VAULT_PR_TOKEN="$(cat .tmp/audit-token-pr 2>/dev/null || true)" VAULT_NS_TOKEN="$(cat .tmp/audit-token-ns 2>/dev/null || true)" VAULT_NS_TOKEN_NAMESPACE="$(cat .tmp/audit-token-ns.namespace 2>/dev/null || true)" uv run pytest -q -m "integration or not integration" --cov=vault_ops --cov-report=term-missing --cov-fail-under=80

  test:e2e:
    desc: "Full e2e from scratch (destructive: wipes .tmp/vault): down, clean, up:all, dr:enable, pr:enable, seed, seed:findings, seed:ns, tokens, test:all, test:ce, lint"
    cmds:
      - scripts/e2e.sh

  test:ci:
    desc: Full CI pipeline (lint + plugin manifests + unit tests with coverage)
    cmds:
      - task: lint
      - task: plugin:validate
      - task: test

  eval:
    desc: "Skill evals (claude plugin eval, offline cases, uses API credits): task eval -- [--runs 1] [--case <glob>]"
    cmds:
      # --scaffold runs our own evals/**/scaffold scripts to stage fixtures; results land in evals/results/
      - claude plugin eval . --tag offline --scaffold --trust-plugin --no-publish -j 4 {{.CLI_ARGS}}

  eval:gepa:
    desc: "GEPA-optimise the SKILL.md body against the offline evals (uses API credits, default $40 cap): task eval:gepa -- [--budget-usd 40]"
    preconditions:
      - sh: command -v claude
        msg: claude CLI not found
    cmds:
      # Writes .tmp/gepa/<timestamp>/ (best/SKILL.md, best.diff, summary.json); never changes the repo
      - uv run --group gepa python scripts/gepa_eval.py {{.CLI_ARGS}}

  docs:diagram:
    desc: Render docs/architecture.svg from docs/architecture.dot (needs Graphviz)
    cmds:
      - dot -Tsvg docs/architecture.dot -o docs/architecture.svg

  rules:export:
    desc: Write skills/vault-ops/references/rules.json from RULES in vault_ops.py
    cmds:
      - uv run python scripts/export_rules.py

  plugin:validate:
    desc: Validate the plugin and marketplace manifests (strict)
    cmds:
      - claude plugin validate --strict .
      - claude plugin validate --strict .claude-plugin/plugin.json

  clean:
    desc: Remove node containers and volumes, caches, results (.tmp/vault-ops) and temporary files (keeps .tmp/spec.md and todo.md)
    cmds:
      # Volumes and .tmp/vault/<node>/init.json go together: data without its unseal key can't be unsealed.
      # Tolerant: with the engine stopped or .env empty, still clean the rest and say what was left.
      - VOLUMES=1 scripts/vault_down.sh || echo "warning - node volumes not removed (container engine down or .env incomplete); run 'task clean' again once it is up" >&2
      - rm -rf .pytest_cache .ruff_cache .coverage htmlcov
      - find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - rm -rf .tmp/vault .tmp/vault-ops .tmp/audit-token .tmp/audit-token-pr .tmp/audit-token-ns .tmp/audit-token-ns.namespace .tmp/audit-token-hcp .tmp/audit-token-hcp.namespace .tmp/admin-token-hcp .tmp/*.log
