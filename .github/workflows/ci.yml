name: ci

# Same gate as `task test:ci`, split into jobs: lint first, then plugin manifests + unit tests.
# Actions and tools are pinned to exact versions. No Vault, licence,
# token or secrets needed; integration/DR tests stay local (`task test:all`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      # An exact version skips the GitHub API tag lookup, so no repo-token is needed.
      - uses: arduino/setup-task@v3.0.0
        with:
          version: "3.54.0"

      - name: Cache pre-commit hooks
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --locked

      - name: task lint
        run: task lint

  # The rest of `task test:ci`; lint already ran in the job above.
  test-ci:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - uses: arduino/setup-task@v3.0.0
        with:
          version: "3.54.0"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install Claude Code CLI (plugin:validate)
        run: npm install -g @anthropic-ai/claude-code@2.1.289

      - name: Install dependencies
        run: uv sync --locked

      - name: task plugin:validate
        run: task plugin:validate

      - name: task test
        run: task test
