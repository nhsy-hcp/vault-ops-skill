[project]
name = "vault-ops-skill"
version = "0.2.2"
description = "Read-only HashiCorp Vault ops Claude skill and its local dev environment"
requires-python = ">=3.12"
dependencies = [
    "hvac==2.4.0",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/vault-ops/scripts"]
markers = ["integration: needs a running, seeded dev Vault (task up && task seed)"]
addopts = "-m 'not integration'"
# Dev Vault uses a self-signed cert with VAULT_SKIP_VERIFY=true
filterwarnings = ["ignore::urllib3.exceptions.InsecureRequestWarning"]
